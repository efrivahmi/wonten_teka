Jum|11','Sab|12','Min|13'].map((d,i)=>'<div class="day '+(i===3?'active':'')+'">'+d.split('|')[0]+'<strong>'+d.split('|')[1]+'</strong></div>').join('')+'</div><div class="schedule-item"><h3>Shift reguler</h3><p>08.00–17.00 · Kantor pusat</p></div>',link('shifts',icon('arrow'),'text-button'))+'<section class="card announcement"><div class="kicker">KABAR RUANG KERJA</div><h2>Bertemu. Berbagi.<br>Bertumbuh bersama.</h2><p>Town hall September<br>Jumat, 18 September · 15.00 WIB</p><div class="avatars"><div class="avatar">AP</div><div class="avatar">DP</div><div class="avatar">NS</div><span>Seluruh tim diundang</span></div>'+link('announcements','Lihat pengumuman '+icon('arrow'),'text-button')+'</section></div></div>'}
function list(){let rows=current.rows||[];rows=rows.map((r,i)=>({r,i})).filter(({r})=>r.join(' ').toLowerCase().includes(query.toLowerCase())&&(filter==='Semua'||/menunggu|aktif|ditinjau|belum|perlu/i.test(r[1])));return '<div class="list-layout"><div class="stack">'+(current.metrics?'<div class="metrics">'+current.metrics.map(([v,l])=>metric(esc(v),l,'Periode September 2026')).join('')+'</div>':'')+'<section class="card"><div class="toolbar"><div class="tabs">'+['Semua','Aktif'].map(l=>'<button data-filter="'+l+'" class="'+(filter===l?'active':'')+'">'+l+'</button>').join('')+'</div><input class="search" aria-label="Cari data" placeholder="Cari di halaman ini..." value="'+esc(query)+'"></div><div id="rows">'+(rows.length?rows.map(({r,i})=>row(r[0],r[1],i,true)).join(''):'<div class="empty">Tidak ada data yang sesuai.<br>Coba kata kunci atau filter lain.</div>')+'</div><div class="form-actions">'+button(current.action,'primary')+'</div></section></div><aside class="card"><div class="row-icon">'+icon('file')+'</div><h2 style="margin-top:18px">Semua lebih jelas.</h2><p class="aside-note">'+esc(current.note||'Temukan rincian dan status terbaru pada setiap item. Setiap perubahan tersimpan dalam riwayat aktivitas.')+'</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><p class="small muted">Butuh bantuan?</p>'+link('help','Buka pusat bantuan '+icon('arrow'),'text-button')+'</aside></div>'}
function form(){return '<div class="card form"><h2>'+ (current.key==='login'?'Masuk ke akun Anda':'Rincian informasi')+'</h2><p class="hint">Lengkapi informasi berikut untuk melanjutkan.</p><form id="edit-form">'+current.fields.map(([l,v],i)=>'<label>'+esc(l)+(l.toLowerCase().includes('alasan')||l==='Alamat'?'<textarea required placeholder="'+esc(v)+'"></textarea>':'<input '+(l.includes('Email')||l.includes('email')?'type="email"':l.includes('sandi')?'type="password"':'type="text"')+' required '+(l.includes('Kata')||l.includes('Email')?'placeholder':'value')+'="'+esc(v)+'">')+'</label>').join('')+'<div class="form-actions"><button class="btn" type="submit">'+esc(current.action)+icon('arrow')+'</button>'+link('dashboard','Batal','btn secondary')+'</div>'+(current.note?'<p class="hint">'+esc(current.note)+'</p>':'')+'</form></div>'}
function calendar(){const days=Array.from({length:35},(_,i)=>i===0||i>30?'':i);return '<div class="list-layout"><div class="card"><div class="card-top"><h2>September 2026</h2><span class="today-status">Bulan ini</span></div><div class="calendar">'+['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>'<div class="cal-head">'+d+'</div>').join('')+days.map(d=>'<div class="'+(d===10?'selected':'')+'">'+d+(d===10?'<small>Hari ini</small>':d===18?'<small>Town hall</small>':'')+'</div>').join('')+'</div><div style="margin-top:22px" class="schedule-item"><h3>10 September · Shift reguler</h3><p>08.00–17.00 · Kantor pusat</p></div><div class="form-actions">'+button(current.action,current.key==='attendance'?'checkin':'primary')+'</div></div><aside>'+card('Agenda berikutnya',row('Town hall September','18 September · 15.00'))+'</aside></div>'}
function scanner(){return '<div class="card form"><h2>Posisikan wajah Anda</h2><p class="hint">Cari cahaya yang cukup dan ikuti arahan di layar.</p><div class="scan-area"><div class="face">'+icon('face')+'</div></div><div class="stepper"><span>01 · Lurus</span><span>02 · Kiri</span><span>03 · Kanan</span></div>'+button('Mulai verifikasi','scan')+'<p class="hint">'+esc(current.note)+'</p></div>'}
function report(){return '<div class="stack"><div class="metrics">'+metric('92<small>%</small>','Rata-rata kehadiran','<b>+4 poin</b> dari periode lalu')+metric('5','Keterlambatan','Periode September 2026')+metric('96<small> jam</small>','Total lembur','Seluruh departemen')+'</div>'+card('Tren kehadiran', '<div class="bars">'+[72,88,79,96,87].map((h,i)=>'<div style="height:'+h+'%"><span>'+['Sen','Sel','Rab','Kam','Jum'][i]+'</span></div>').join('')+'</div><div class="form-actions" style="margin-top:45px">'+button('Ekspor laporan','export')+'</div>')+'</div>'}
function state(){if(viewState==='loading')return '<div class="card" role="status"><p class="hint">Memuat data...</p><div class="view-loading"></div></div>';if(viewState==='empty')return '<div class="card empty"><h2>Belum ada aktivitas.</h2><p>Data Anda akan muncul di sini setelah tersedia.</p>'+button('Kembali ke tampilan','normal','soft')+'</div>';if(viewState==='error')return '<div class="error-state" role="alert"><h2>Data belum dapat dimuat.</h2><p>Periksa koneksi Anda, lalu coba kembali.</p>'+button('Coba lagi','normal')+'</div>';return ''}
function render(){const key=location.hash.slice(1)||'dashboard';current=screens.find(s=>s.key===key)||screens.find(s=>s.key==='not-found');const admin=current.page==='4:3',auth=current.page==='0:1';const mainKeys=admin?['admin-dashboard','approvals','employees','schedule','reports']:['dashboard','attendance','leave','overtime','claims','payslip'];const extraKeys=admin?['devices','events','payroll','leave-types','attendance-flags','biometrics','settings']:['shifts','calendar','announcements','tasks','attendance-adjustments','business-trips','directory'];let content=state()||(current.kind==='dashboard'?dashboard():current.kind==='admin-dashboard'?dashboard(true):current.kind==='form'?form():current.kind==='calendar'||current.kind==='attendance'?calendar():current.kind==='scan'?scanner():current.kind==='report'?report():list());if(auth)content='<div class="auth-grid"><section class="auth-message"><div><div class="kicker">WONTEN TEKA</div><h2>Hadir untuk<br>hari yang<br>lebih baik.</h2><p>Satu ruang untuk tim,<br>pekerjaan, dan pertumbuhan.</p></div><p class="small">Terhubung dengan tim Anda.</p></section><div>'+content+'</div></div>';document.title=labels[current.key]+' — Wonten Teka';document.getElementById('root').innerHTML='<div class="app"><div class="backdrop" data-action="close-menu"></div><aside class="sidebar"><a class="logo" href="#dashboard"><span class="logo-mark">w</span>wonten teka<span style="color:#78a83d">.</span></a><div class="workspace"><i>'+icon('bag')+'</i><div><strong>Wonten Teka</strong><span>Ruang kerja perusahaan</span></div></div><nav class="nav" aria-label="Navigasi utama"><div class="nav-group">MENU UTAMA</div>'+menu(mainKeys)+'<div class="nav-group">RUANG KERJA</div>'+menu(extraKeys)+'<div class="nav-group">AKUN & BANTUAN</div>'+menu(['profile','help'])+'<div class="nav-group">JELAJAHI DESAIN</div>'+menu(admin?['dashboard','login','onboarding','device','device-pending','face','complete-profile','not-found']:['admin-dashboard','login','onboarding','device','device-pending','face','complete-profile','not-found'])+'</nav><div class="sidebar-foot"><a href="#profile" class="account"><div class="avatar">AP</div><div><strong>Alya Putri</strong><span>Product Designer</span></div>'+icon('logout')+'</a></div></aside><div><header class="topbar"><a href="#dashboard" class="mobile-top logo"><span class="logo-mark">w</span>wonten teka</a><div class="crumb">'+icon('home')+'<span>/</span><span>'+labels[current.key]+'</span></div><div class="tools"><span class="demo">PROTOTIPE · DATA CONTOH</span><select class="state-switch" aria-label="Pratinjau kondisi">'+[['normal','Normal'],['loading','Memuat'],['empty','Kosong'],['error','Gagal']].map(([v,l])=>'<option value="'+v+'" '+(v===viewState?'selected':'')+'>'+l+'</option>').join('')+'</select>'+link('notifications',icon('bell'),'tool')+'<div class="avatar">AP</div><button class="tool menu-toggle" data-action="menu" aria-label="Buka menu">'+icon('menu')+'</button></div></header><main><div class="heading"><div><div class="kicker">'+(admin?'YOUR PEOPLE, AT A GLANCE':'YOUR EVERYDAY WORKSPACE')+'</div><h1>'+esc(current.key==='admin-dashboard'?'Selamat pagi, Nadia.':current.title)+'</h1><p>'+esc(current.sub)+'</p></div><div class="date">'+icon('calendar')+'10 September 2026</div></div>'+content+'<footer class="footer"><span>© 2026 Wonten Teka · Hadir, terhubung, bertumbuh.</span><span>Prototipe desain · Data ilustrasi</span></footer></main></div></div><nav class="mobile-nav" aria-label="Menu ponsel">'+[['dashboard','home','Beranda'],['attendance','calendar','Absensi'],['leave','file','Pengajuan'],['profile','users','Profil']].map(([k,i,l])=>link(k,icon(i)+l,current.key===k?'active':'')).join('')+'<button data-action="menu">'+icon('menu')+'Lainnya</button></nav>';wire()}
function toast(s){document.getElementById('toast').innerHTML='<div class="toast" role="status">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
let lastFocus;
function modal(title,body){lastFocus=document.activeElement;const d=document.getElementById('dialog');d.innerHTML='<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">'+esc(title)+'</h2><button class="close" aria-label="Tutup" data-action="close">×</button></div>'+body+'</section></div>';d.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));d.querySelector('button')?.focus();d.onkeydown=e=>{if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){let a=[...d.querySelectorAll('button,a,input,select,textarea')];if(e.shiftKey&&document.activeElement===a[0]){a.at(-1).focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){a[0].focus();e.preventDefault()}}};}
function closeModal(){document.getElementById('dialog').innerHTML='';lastFocus?.focus()}
function action(a){if(a==='close'){closeModal();return}if(a==='menu'){document.body.classList.toggle('open-sidebar');return}if(a==='close-menu'){document.body.classList.remove('open-sidebar');return}if(a==='normal'){viewState='normal';render();return}if(a==='checkin'){modal('Absensi masuk','<p>Pratinjau alur verifikasi. Prototipe ini tidak mengakses kamera, lokasi, atau menyimpan kehadiran nyata.</p><div class="stepper"><span>1 · Perangkat</span><span>2 · Lokasi</span><span>3 · Wajah</span></div><div class="schedule-item"><h3>Kantor pusat · Radius 100 m</h3><p>Lokasi dan biometrik diperiksa pada aplikasi aktif.</p></div><div class="form-actions">'+button('Simulasikan berhasil','checkin-ok')+button('Lihat kondisi gagal','checkin-error','secondary')+'</div>');return}if(a==='checkin-ok'){checkedIn=true;closeModal();render();toast('Simulasi: absensi masuk berhasil pukul 08.00.');return}if(a==='checkin-error'){modal('Lokasi di luar area kantor','<p>Contoh: lokasi terdeteksi 230 meter dari kantor; radius yang diizinkan 100 meter. Periksa lokasi dan coba lagi.</p><div class="form-actions">'+button('Coba lagi','checkin')+link('help','Buka bantuan','btn secondary')+'</div>');return}if(a==='scan'){modal('Verifikasi wajah','<p>Ini pratinjau alur pendaftaran, bukan pemeriksaan biometrik sungguhan.</p><div class="scan-area"><div class="face">'+icon('face')+'</div></div><p>Lihat lurus ke kamera, lalu putar wajah mengikuti arahan.</p>'+button('Selesaikan simulasi','scan-ok'));return}if(a==='scan-ok'){closeModal();toast('Simulasi pendaftaran wajah selesai.');return}if(a==='export'){const csv='Hari,Kehadiran (%)\nSenin,72\nSelasa,88\nRabu,79\nKamis,96\nJumat,87\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const x=document.createElement('a');x.href=url;x.download='contoh-laporan-kehadiran.csv';x.click();URL.revokeObjectURL(url);return}if(a==='approve'||a==='reject'){closeModal();toast(a==='approve'?'Simulasi: pengajuan disetujui.':'Simulasi: pengajuan ditolak.');return}if(a==='primary'){primary();return}location.hash=a;}
function primary(){const k=current.key;if(k==='leave'){location.hash='request-new';return}if(k==='payslip'){location.hash='payslip-detail';return}if(k==='onboarding'){location.hash='complete-profile';return}if(k==='device-pending'){toast('Simulasi: masih menunggu persetujuan admin.');return}if(k==='notifications'){toast('Simulasi: semua notifikasi ditandai sudah dibaca.');return}if(k==='request-detail'){location.hash='leave';return}if(k==='shifts'){location.hash='calendar';return}if(k==='not-found'){location.hash='dashboard';return}if(k==='help'){modal('Hubungi admin perusahaan','<p>Sampaikan nama, waktu kejadian, dan pesan kesalahan kepada admin HR melalui kanal internal perusahaan.</p>'+button('Mengerti','close'));return}if(k==='payslip-detail'){window.print();return}if(k==='reports'){action('export');return}if(['overtime','claims','attendance-adjustments','business-trips','tasks','employees','schedule','events'].includes(k)){const fields=k==='overtime'?['Tanggal','Jam mulai','Jam selesai','Alasan']:k==='claims'?['Kategori','Jumlah (Rp)','Tanggal transaksi','Bukti pembayaran']:k==='business-trips'?['Tujuan','Tanggal mulai','Tanggal selesai','Keperluan']:k==='attendance-adjustments'?['Tanggal absensi','Jam yang benar','Alasan koreksi']:k==='tasks'?['Judul tugas','Tanggal target']:['Nama','Tanggal','Keterangan'];modal(current.action,'<form id="modal-form" class="form">'+fields.map(l=>'<label>'+l+'<input required name="'+l+'" placeholder="'+l+'"></label>').join('')+'<button class="btn" type="submit">Simpan simulasi</button></form>');document.getElementById('modal-form').onsubmit=e=>{e.preventDefault();closeModal();toast('Data contoh tersimpan dalam simulasi ini. Tidak dikirim ke server.');};return}if(current.rows?.length){detail(0);return}toast('Pratinjau tampilan '+labels[k]);}
function detail(i){const r=current.rows?.[i];if(!r)return;const admin=current.page==='4:3';modal(r[0],'<p>'+esc(r[1])+'</p><div class="schedule-item"><h3>Ringkasan aktivitas</h3><p>10 September 2026 · Data ilustrasi</p></div><p>'+esc(current.note||'Status dan rincian item ditampilkan dalam panel detail agar konteks halaman tetap terjaga.')+'</p><div class="form-actions">'+(admin&&['approvals','devices','attendance-flags'].includes(current.key)?button(current.key==='devices'?'Aktifkan':'Setujui','approve')+button('Tolak','reject','danger'):button('Tutup detail','close','secondary'))+'</div>');}
function wire(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>detail(Number(b.dataset.row)));document.querySelector('.state-switch').onchange=e=>{viewState=e.target.value;render()};const search=document.querySelector('.search');if(search)search.oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;render();const n=document.querySelector('.search');n.focus();n.setSelectionRange(pos,pos)};const f=document.getElementById('edit-form');if(f)f.onsubmit=e=>{e.preventDefault();if(current.key==='login')location.hash='dashboard';else if(current.key==='complete-profile')location.hash='device';else if(current.key==='device')location.hash='device-pending';else if(current.key==='request-new')location.hash='request-detail';else toast('Simulasi: perubahan berhasil disimpan.');};}
window.addEventListener('hashchange',()=>{filter='Semua';query='';viewState='normal';closeModal();document.body.classList.remove('open-sidebar');render();window.scrollTo(0,0)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('open-sidebar')});render();
</script></body></html>
